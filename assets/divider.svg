<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="80" viewBox="0 0 1200 80" role="img" aria-label="Orbit divider">
  <defs>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .pulse { animation: pulse 2.6s ease-in-out infinite; transform-origin: 600px 40px; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  </style>
  <line x1="60" y1="40" x2="520" y2="40" stroke="url(#fadeL)" stroke-width="2"/>
  <line x1="680" y1="40" x2="1140" y2="40" stroke="url(#fadeR)" stroke-width="2"/>
  <g class="pulse">
    <circle cx="600" cy="40" r="11" fill="none" stroke="#00e5ff" stroke-width="2"/>
    <ellipse cx="600" cy="40" rx="26" ry="10" fill="none" stroke="#a78bfa" stroke-width="2" transform="rotate(-20 600 40)"/>
    <circle cx="600" cy="40" r="5" fill="#a78bfa"/>
  </g>
  <circle cx="560" cy="40" r="2.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="640" cy="40" r="2.5" fill="#ffffff" opacity="0.8"/>
</svg>
